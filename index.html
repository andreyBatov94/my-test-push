<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PWA Push Test</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <h1>PWA Push MVP</h1>
    <button id="subscribe">Включить уведомления</button>
    <p id="status"></p>
    <code id="subscription-data" style="word-break: break-all; display: block; margin-top: 20px;"></code>

    <script>
        const publicKey = 'BKbsyg5hAmbBfprV689xLqmcpemSpsH05dyMxjBLClnhHBEEhFMO4qnkUcdjaiSJCPS95B3D0Q8wskAPk-4vgz0';

        async function registerSW() {
            const registration = await navigator.serviceWorker.register('sw.js?v=2')
            return registration;
        }

        document.getElementById('subscribe').addEventListener('click', async () => {
            const reg = await registerSW();
            const sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: publicKey
            });
            
            // Выводим данные подписки на экран, чтобы скопировать их для теста
            document.getElementById('subscription-data').innerText = JSON.stringify(sub);
            document.getElementById('status').innerText = "Подписка создана! Скопируйте код ниже:";
            console.log(JSON.stringify(sub));
        });
    </script>
</body>
</html>
